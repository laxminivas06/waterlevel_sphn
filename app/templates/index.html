<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroSense IoT - Smart Water Tank Monitoring System v2.0</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Chart.js for Historical Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- React 18 & Babel for Zero-Build PythonAnywhere Deployment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            scada: {
              900: '#070d19',
              850: '#0b1326',
              800: '#0f172a',
              750: '#15203b',
              700: '#1e293b',
              600: '#334155',
              500: '#475569',
              accent: '#06b6d4',
              accentHover: '#0891b2',
              normal: '#10b981',
              warning: '#f59e0b',
              critical: '#ef4444',
              overload: '#dc2626',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom SCADA Wave Animations */
    @keyframes waveMotionFront {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(-50%); }
    }
    @keyframes waveMotionBack {
      0% { transform: translateX(-50%); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes sonarWave {
      0% { opacity: 0.8; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 40; }
    }
    .wave-front {
      animation: waveMotionFront 6s linear infinite;
    }
    .wave-back {
      animation: waveMotionBack 8s linear infinite;
    }
    .sonar-beam {
      animation: sonarWave 1.8s linear infinite;
    }
    .pulse-glow {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    /* Custom Glassmorphism & Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-scada-900 text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white">

  <!-- Root React Mount Container -->
  <div id="root"></div>

  <!-- React 18 Application Script -->
  {% raw %}
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // API Client Helper
    // =========================================================================
    const API = {
      async getSummary() {
        const res = await fetch('/api/v1/system/summary');
        return res.json();
      },
      async getTanks() {
        const res = await fetch('/api/v1/tanks');
        return res.json();
      },
      async getTank(id) {
        const res = await fetch(`/api/v1/tanks/${id}`);
        return res.json();
      },
      async getTankHistory(id, range = '24h', startDate = '', endDate = '') {
        let url = `/api/v1/tanks/${id}/history?range=${range}`;
        if (startDate && endDate) url += `&start_date=${startDate}&end_date=${endDate}`;
        const res = await fetch(url);
        return res.json();
      },
      async getDevices() {
        const res = await fetch('/api/v1/devices');
        return res.json();
      },
      async registerDevice(data) {
        const res = await fetch('/api/v1/devices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      },
      async getAlerts(unack = true) {
        const res = await fetch(`/api/v1/alerts?unacknowledged=${unack}`);
        return res.json();
      },
      async acknowledgeAlert(id) {
        const res = await fetch(`/api/v1/alerts/${id}/ack`, { method: 'POST' });
        return res.json();
      },
      async saveTank(data) {
        const res = await fetch('/api/v1/tanks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      },
      async simulate(data) {
        const res = await fetch('/api/v1/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      }
    };

    // =========================================================================
    // SVG Animated Fluid Tank Component (Section 6 & 7)
    // =========================================================================
    function FluidTankVisualizer({ percentage = 0, status = 'NORMAL', heightCm = 200, airGapCm = 30, isOverloaded = false, compact = false }) {
      const clampedPct = Math.min(105, Math.max(0, percentage));
      
      // Calculate dynamic SVG coordinates
      // Viewbox is 240 width, 320 height. Usable tank body height = 240px (y: 40 to 280)
      const tankTopY = 40;
      const tankBottomY = 280;
      const tankUsableH = tankBottomY - tankTopY; // 240px
      const liquidH = (clampedPct / 100) * tankUsableH;
      const liquidY = tankBottomY - liquidH;

      // Status-dependent gradient colors
      let gradStart = '#10b981';
      let gradEnd = '#059669';
      let badgeBg = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

      if (isOverloaded || status === 'OVERLOADED') {
        gradStart = '#ef4444';
        gradEnd = '#b91c1c';
        badgeBg = 'bg-red-500/30 text-red-300 border-red-500 animate-pulse';
      } else if (status === 'CRITICAL LOW') {
        gradStart = '#f87171';
        gradEnd = '#dc2626';
        badgeBg = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
      } else if (status === 'LOW') {
        gradStart = '#fbbf24';
        gradEnd = '#d97706';
        badgeBg = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
      } else if (status === 'HIGH') {
        gradStart = '#38bdf8';
        gradEnd = '#0284c7';
        badgeBg = 'bg-sky-500/20 text-sky-400 border-sky-500/30';
      }

      return (
        <div className="relative flex flex-col items-center">
          <svg className={compact ? "w-44 h-56" : "w-56 h-72"} viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id={`liquidGrad-${clampedPct}`} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={gradStart} />
                <stop offset="100%" stopColor={gradEnd} />
              </linearGradient>

              <linearGradient id="tankShell" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#334155" />
                <stop offset="15%" stopColor="#1e293b" />
                <stop offset="85%" stopColor="#1e293b" />
                <stop offset="100%" stopColor="#334155" />
              </linearGradient>

              <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#ffffff" stopOpacity="0.15" />
                <stop offset="25%" stopColor="#ffffff" stopOpacity="0.04" />
                <stop offset="75%" stopColor="#000000" stopOpacity="0.08" />
                <stop offset="100%" stopColor="#ffffff" stopOpacity="0.12" />
              </linearGradient>

              <clipPath id="tankInnerClip">
                <rect x="35" y="40" width="170" height="240" rx="16" ry="16" />
              </clipPath>
            </defs>

            {/* Ultrasonic Sensor Transducer Housing on Top */}
            <rect x="85" y="16" width="70" height="18" rx="5" fill="#1e293b" stroke="#475569" strokeWidth="2" />
            <circle cx="102" cy="25" r="4.5" fill="#334155" stroke="#64748b" strokeWidth="1.5" />
            <circle cx="138" cy="25" r="4.5" fill="#334155" stroke="#64748b" strokeWidth="1.5" />
            
            {/* Sensor Sonic Pulse Ray Beam down to water level */}
            <line x1="120" y1="34" x2="120" y2={liquidY} stroke="#06b6d4" strokeWidth="2.5" strokeDasharray="6 4" className="sonar-beam" />
            
            {/* Tank Shell Background Vessel */}
            <rect x="35" y="40" width="170" height="240" rx="16" fill="url(#tankShell)" stroke="#475569" strokeWidth="3" />

            {/* Clipped Liquid Column */}
            <g clipPath="url(#tankInnerClip)">
              {/* Base Liquid Body Rect */}
              <rect x="35" y={liquidY} width="170" height={liquidH + 10} fill={`url(#liquidGrad-${clampedPct})`} />
              
              {/* Back Sinusoidal Wave */}
              <g transform={`translate(0, ${liquidY})`}>
                <path className="wave-back opacity-50" fill={gradEnd}
                  d="M-200,0 C-150,-10 -100,10 -50,0 C0,-10 50,10 100,0 C150,-10 200,10 250,0 C300,-10 350,10 400,0 L400,60 L-200,60 Z" />
              </g>

              {/* Front Sinusoidal Wave */}
              <g transform={`translate(0, ${liquidY})`}>
                <path className="wave-front opacity-80" fill={`url(#liquidGrad-${clampedPct})`}
                  d="M-200,0 C-140,8 -80,-8 -20,0 C40,8 100,-8 160,0 C220,8 280,-8 340,0 C400,8 460,-8 520,0 L520,60 L-200,60 Z" />
              </g>

              {/* Glass Surface Reflection Sheen */}
              <rect x="35" y="40" width="170" height="240" fill="url(#glassGloss)" pointerEvents="none" />
            </g>

            {/* Calibration Graduation Marks & Percent Labels */}
            <g stroke="#64748b" strokeWidth="1.5">
              <line x1="26" y1="40" x2="35" y2="40" />
              <text x="22" y="44" fontSize="9" fill="#94a3b8" textAnchor="end" className="font-mono">100%</text>

              <line x1="28" y1="100" x2="35" y2="100" />
              <text x="22" y="103" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">75%</text>

              <line x1="26" y1="160" x2="35" y2="160" />
              <text x="22" y="163" fontSize="9" fill="#94a3b8" textAnchor="end" className="font-mono">50%</text>

              <line x1="28" y1="220" x2="35" y2="220" />
              <text x="22" y="223" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">25%</text>

              <line x1="26" y1="280" x2="35" y2="280" />
              <text x="22" y="283" fontSize="9" fill="#94a3b8" textAnchor="end" className="font-mono">0%</text>
            </g>

            {/* Base Stand Feet */}
            <rect x="65" y="284" width="110" height="12" rx="3" fill="#334155" stroke="#475569" strokeWidth="1.5" />
            <rect x="50" y="296" width="140" height="6" rx="2" fill="#1e293b" />

            {/* Center Readout Overlay */}
            <g textAnchor="middle">
              <text x="120" y="148" className="font-mono font-bold text-3xl" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">
                {clampedPct.toFixed(1)}%
              </text>
              <text x="120" y="172" className="font-mono text-xs" fill="#e2e8f0" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.8))">
                Air Gap: {airGapCm.toFixed(1)} cm
              </text>
            </g>

            {/* Flashing Overload Alert Banner */}
            {isOverloaded && (
              <g transform="translate(45, 105)">
                <rect width="150" height="30" rx="6" fill="#dc2626" opacity="0.95" stroke="#ffffff" strokeWidth="1.5" className="animate-pulse" />
                <text x="75" y="20" fill="#ffffff" fontSize="12" fontWeight="bold" textAnchor="middle" className="font-mono">
                  ⚠️ OVERFLOW RISK
                </text>
              </g>
            )}
          </svg>

          {/* Status Pill Under Tank */}
          <div className={`mt-2 px-3 py-1 rounded-full text-xs font-semibold border ${badgeBg}`}>
            {status}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Sidebar Component
    // =========================================================================
    function Sidebar({ currentTab, setCurrentTab, alertCount = 0 }) {
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'tanks', label: 'Tank Monitoring', icon: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' },
        { id: 'analytics', label: 'Analytics & History', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
        { id: 'devices', label: 'Device Management', icon: 'M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z' },
        { id: 'alerts', label: 'Alerts', icon: 'M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9', badge: alertCount },
        { id: 'settings', label: 'Settings & Simulator', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z' },
      ];

      return (
        <aside className="w-64 bg-scada-850 border-r border-scada-700 flex flex-col shrink-0">
          {/* Logo & Brand Header */}
          <div className="p-5 border-b border-scada-700 flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
              <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
              </svg>
            </div>
            <div>
              <h1 className="font-extrabold text-base tracking-tight text-white flex items-center gap-1.5">
                HydroSense <span className="text-cyan-400 font-mono text-xs px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-800">v2.1</span>
              </h1>
              <p className="text-xs text-slate-400">Smart Water Tank SCADA</p>
            </div>
          </div>

          {/* Navigation Links */}
          <nav className="p-3 space-y-1 flex-1">
            {navItems.map((item) => {
              const active = currentTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setCurrentTab(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${
                    active
                      ? 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/30 shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-scada-800 border border-transparent'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <svg className={`w-5 h-5 ${active ? 'text-cyan-400' : 'text-slate-400'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon} />
                    </svg>
                    <span>{item.label}</span>
                  </div>
                  {item.badge > 0 && (
                    <span className="px-2 py-0.5 text-xs font-bold rounded-full bg-red-500 text-white animate-pulse">
                      {item.badge}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          {/* Footer Server Health Indicator */}
          <div className="p-4 border-t border-scada-700 bg-scada-900/50">
            <div className="flex items-center justify-between text-xs text-slate-400">
              <span className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>Server Online</span>
              </span>
              <span className="font-mono text-slate-500">PythonAnywhere</span>
            </div>
          </div>
        </aside>
      );
    }

    // =========================================================================
    // Header Component
    // =========================================================================
    function Header({ tanks, selectedTankId, setSelectedTankId, autoRefresh, setAutoRefresh, onSimulateOpen, activeAlertCount = 0 }) {
      return (
        <header className="h-16 bg-scada-850 border-b border-scada-700 px-6 flex items-center justify-between gap-4 shrink-0">
          {/* Active Tank Switcher */}
          <div className="flex items-center gap-3">
            <span className="text-xs uppercase font-mono tracking-wider text-slate-400">Active Tank:</span>
            <select
              value={selectedTankId}
              onChange={(e) => setSelectedTankId(e.target.value)}
              className="bg-scada-800 border border-scada-600 rounded-lg px-3 py-1.5 text-sm font-semibold text-white focus:outline-none focus:border-cyan-500"
            >
              {tanks.map((t) => (
                <option key={t.tank_id} value={t.tank_id}>
                  {t.tank_name} ({t.is_online ? '🟢 Online' : '⚪ Offline'})
                </option>
              ))}
            </select>
          </div>

          {/* Controls: Simulator, Auto-refresh, Alerts Badge */}
          <div className="flex items-center gap-3">
            <button
              onClick={onSimulateOpen}
              className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600/20 text-cyan-300 border border-cyan-500/30 hover:bg-cyan-600/30 transition-colors"
            >
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              <span>Test Simulator</span>
            </button>

            <button
              onClick={() => setAutoRefresh(!autoRefresh)}
              className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${
                autoRefresh
                  ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
                  : 'bg-scada-800 text-slate-400 border-scada-600'
              }`}
            >
              <span className={`w-2 h-2 rounded-full ${autoRefresh ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`}></span>
              <span>{autoRefresh ? 'Live Polling (5s)' : 'Polling Paused'}</span>
            </button>
          </div>
        </header>
      );
    }

    // =========================================================================
    // Dashboard View (Section 6)
    // =========================================================================
    function DashboardView({ summary, tanks, onSelectTank, onOpenSettings }) {
      return (
        <div className="p-6 space-y-6">
          {/* 1. KPI Metric Scorecard Grid */}
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
            <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-mono uppercase text-slate-400">Total Tanks</span>
              <span className="text-2xl font-extrabold text-white mt-2 font-mono">{summary.total_tanks || 0}</span>
              <span className="text-xs text-slate-500 mt-1">Configured vessels</span>
            </div>

            <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-mono uppercase text-emerald-400 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Online Devices
              </span>
              <span className="text-2xl font-extrabold text-emerald-400 mt-2 font-mono">{summary.online_devices || 0}</span>
              <span className="text-xs text-slate-500 mt-1">Active telemetry</span>
            </div>

            <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-mono uppercase text-slate-400 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-slate-500"></span> Offline Devices
              </span>
              <span className="text-2xl font-extrabold text-slate-300 mt-2 font-mono">{summary.offline_devices || 0}</span>
              <span className="text-xs text-slate-500 mt-1">&gt; 300s timeout</span>
            </div>

            <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-mono uppercase text-cyan-400">Average Level</span>
              <span className="text-2xl font-extrabold text-cyan-300 mt-2 font-mono">
                {(summary.average_water_percentage || 0).toFixed(1)}%
              </span>
              <div className="w-full bg-scada-700 rounded-full h-1.5 mt-2 overflow-hidden">

    // =========================================================================
    // Analytics & History View (Section 8)
    // =========================================================================
    function AnalyticsView({ tanks, selectedTankId }) {
      const [historyData, setHistoryData] = useState(null);
      const [range, setRange] = useState('24h');
      const [metricType, setMetricType] = useState('percentage'); // 'percentage' or 'volume'
      const [loading, setLoading] = useState(true);
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!selectedTankId) return;
        setLoading(true);
        API.getTankHistory(selectedTankId, range).then((data) => {
          setHistoryData(data);
          setLoading(false);
        });
      }, [selectedTankId, range]);

      useEffect(() => {
        if (!historyData || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const labels = (historyData.data || []).map((d) => d.timestamp.split(' ')[1]?.substring(0, 5) || d.timestamp);
        const values = (historyData.data || []).map((d) => metricType === 'percentage' ? d.water_percentage : d.water_volume);

        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(6, 182, 212, 0.45)');
        gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: metricType === 'percentage' ? 'Water Level (%)' : 'Water Volume (L)',
              data: values,
              borderColor: '#06b6d4',
              backgroundColor: gradient,
              borderWidth: 2.5,
              pointRadius: labels.length > 50 ? 0 : 3,
              pointHoverRadius: 6,
              tension: 0.35,
              fill: true,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#0f172a',
                borderColor: '#334155',
                borderWidth: 1,
                titleFont: { family: 'JetBrains Mono' },
                bodyFont: { family: 'JetBrains Mono' },
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(51, 65, 85, 0.3)' },
                ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 10 } }
              },
              y: {
                grid: { color: 'rgba(51, 65, 85, 0.3)' },
                ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 10 } },
                min: 0,
                max: metricType === 'percentage' ? 100 : undefined,
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [historyData, metricType]);

      const exportCSV = () => {
        if (!historyData?.data?.length) return;
        const rows = [['timestamp', 'water_percentage', 'water_volume', 'distance_cm', 'status']];
        historyData.data.forEach((r) => {
          rows.push([r.timestamp, r.water_percentage, r.water_volume, r.distance_cm, r.status]);
        });
        const csvContent = 'data:text/csv;charset=utf-8,' + rows.map((e) => e.join(',')).join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `hydrosense_${selectedTankId}_${range}.csv`);
        document.body.appendChild(link);
        link.click();
      };

      return (
        <div className="p-6 space-y-6">
          {/* Top Bar: Range Selector & Metric Mode */}
          <div className="flex flex-wrap items-center justify-between gap-4 bg-scada-800 p-4 rounded-xl border border-scada-700">
            <div>
              <h2 className="text-lg font-bold text-white">Historical Telemetry & Consumption Analytics</h2>
              <p className="text-xs text-slate-400">Continuous telemetry retention and consumption drawdown tracking</p>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex rounded-lg bg-scada-900 p-1 border border-scada-700">
                {['24h', '7d', '15d'].map((r) => (
                  <button
                    key={r}
                    onClick={() => setRange(r)}
                    className={`px-3 py-1 text-xs font-semibold rounded-md uppercase font-mono transition-colors ${
                      range === r ? 'bg-cyan-500 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    {r}
                  </button>
                ))}
              </div>

              <div className="flex rounded-lg bg-scada-900 p-1 border border-scada-700">
                <button
                  onClick={() => setMetricType('percentage')}
                  className={`px-3 py-1 text-xs font-semibold rounded-md transition-colors ${
                    metricType === 'percentage' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Level %
                </button>
                <button
                  onClick={() => setMetricType('volume')}
                  className={`px-3 py-1 text-xs font-semibold rounded-md transition-colors ${
                    metricType === 'volume' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Volume (L)
                </button>
              </div>

              <button
                onClick={exportCSV}
                className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-scada-700 hover:bg-scada-600 text-slate-200 border border-scada-600 flex items-center gap-1.5"
              >
                <span>Export CSV</span>
              </button>
            </div>
          </div>

          {/* Statistical Metrics Grid */}
          {historyData && (
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
              <div className="bg-scada-800 p-4 rounded-xl border border-scada-700 font-mono">
                <span className="text-xs text-slate-400 block uppercase">Minimum Fill</span>
                <span className="text-xl font-bold text-rose-400 mt-1 block">{historyData.min_percentage}%</span>
                <span className="text-xs text-slate-500">{historyData.min_volume} Litres</span>
              </div>
              <div className="bg-scada-800 p-4 rounded-xl border border-scada-700 font-mono">
                <span className="text-xs text-slate-400 block uppercase">Maximum Fill</span>
                <span className="text-xl font-bold text-emerald-400 mt-1 block">{historyData.max_percentage}%</span>
                <span className="text-xs text-slate-500">{historyData.max_volume} Litres</span>
              </div>
              <div className="bg-scada-800 p-4 rounded-xl border border-scada-700 font-mono">
                <span className="text-xs text-slate-400 block uppercase">Average Fill</span>
                <span className="text-xl font-bold text-cyan-300 mt-1 block">{historyData.avg_percentage}%</span>
                <span className="text-xs text-slate-500">{historyData.avg_volume} Litres</span>
              </div>
              <div className="bg-scada-800 p-4 rounded-xl border border-scada-700 font-mono">
                <span className="text-xs text-slate-400 block uppercase">Estimated Consumption</span>
                <span className="text-xl font-bold text-amber-300 mt-1 block">{historyData.estimated_consumption_litres} L</span>
                <span className="text-xs text-slate-500">Cumulative drawdown</span>
              </div>
              <div className="bg-scada-800 p-4 rounded-xl border border-scada-700 font-mono">
                <span className="text-xs text-slate-400 block uppercase">Net Change</span>
                <span className={`text-xl font-bold mt-1 block ${historyData.net_volume_change >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {historyData.net_volume_change >= 0 ? '+' : ''}{historyData.net_volume_change} L
                </span>
                <span className="text-xs text-slate-500">{historyData.count} data points</span>
              </div>
            </div>
          )}

          {/* Canvas Chart */}
          <div className="bg-scada-800 p-5 rounded-2xl border border-scada-700 h-96 relative">
            {loading ? (
              <div className="flex items-center justify-center h-full text-slate-400 font-mono text-sm">
                Loading telemetry stream...
              </div>
            ) : (
              <canvas ref={chartRef}></canvas>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================

        await API.acknowledgeAlert(id);
        onReload();
      };

      return (
        <div className="p-6 space-y-4">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-lg font-bold text-white">System Security & Operational Alerts</h2>

            </div>
            <span className="text-xs font-mono px-3 py-1 rounded-full bg-scada-800 border border-scada-700 text-slate-400">
              {alerts.length} Active Alerts
            </span>
          </div>

          <div className="space-y-3">
            {alerts.length === 0 ? (
              <div className="bg-scada-800 p-8 rounded-xl border border-scada-700 text-center text-slate-400 font-mono text-sm">
                ✓ No active alerts detected. All water levels and sensors nominal.
              </div>
            ) : (
              alerts.map((a) => (
                <div
                  key={a.id}
                  className={`p-4 rounded-xl border flex items-center justify-between gap-4 transition-all ${
                    a.severity === 'critical'
                      ? 'bg-red-500/10 border-red-500/40 text-red-200'
                      : 'bg-amber-500/10 border-amber-500/40 text-amber-200'
                  }`}
                >
                  <div className="flex items-start gap-3">
                    <span className="text-xl">{a.severity === 'critical' ? '🚨' : '⚠️'}</span>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-sm font-mono uppercase">{a.alert_type.replace('_', ' ')}</span>
                        <span className="text-xs text-slate-400 font-mono">[{a.tank_id}]</span>
                        <span className="text-xs text-slate-500 font-mono">{a.timestamp}</span>
                      </div>
                      <p className="text-xs mt-1 text-slate-300">{a.message}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => handleAck(a.id)}
                    className="px-3 py-1.5 rounded-lg text-xs font-bold bg-scada-700 hover:bg-scada-600 text-white border border-scada-600 shrink-0"
                  >
                    Acknowledge
                  </button>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

            shape: currentTank.shape,
            tank_height_cm: currentTank.tank_height_cm,
            sensor_offset_cm: currentTank.sensor_offset_cm,
            total_capacity_litres: currentTank.total_capacity_litres,
          });
        }
      }, [currentTank.tank_id]);

      const handleSimulate = async (distance) => {
        const val = distance !== undefined ? distance : distSlider;
        const res = await API.simulate({ tank_id: currentTank.tank_id, distance_cm: parseFloat(val) });
        setSimResult(res);
        onReload();
      };

      const handleSaveSettings = async (e) => {
        e.preventDefault();
        await API.saveTank(tankForm);
        alert('Tank geometry settings updated successfully!');
        onReload();
      };

      return (
        <div className="p-6 space-y-6">
          {/* 1. Interactive Testing Mode Simulator (Section 14) */}
          <div className="bg-scada-800 p-6 rounded-2xl border border-scada-700 shadow-xl space-y-4">
            <div className="flex items-center justify-between border-b border-scada-700 pb-3">
              <div>
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  <span>⚡ Manual Testing Mode & Ultrasonic Sensor Simulator</span>
                  <span className="text-xs font-mono px-2 py-0.5 rounded bg-cyan-900 border border-cyan-700 text-cyan-300">
                    Section 14 Compliant
                  </span>
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Inject live ultrasonic telemetry without physical hardware. Verifies physics, alerts, and dashboard updates.
                </p>
              </div>
              <span className="text-xs font-mono text-cyan-400">Target: {currentTank.tank_name}</span>
            </div>

            {/* Slider & Presets */}
            <div className="space-y-4 pt-2">
              <div className="flex items-center justify-between font-mono text-sm">
                <span className="text-slate-400">Ultrasonic Distance:</span>
                <span className="text-2xl font-bold text-cyan-400">{distSlider} cm</span>
              </div>

              <input
                type="range"
                min="0"
                max="250"
                step="0.5"
                value={distSlider}
                onChange={(e) => setDistSlider(parseFloat(e.target.value))}
                className="w-full accent-cyan-500 h-2 bg-scada-900 rounded-lg cursor-pointer"
              />

              {/* Quick Presets */}
              <div className="flex flex-wrap gap-2 pt-2">
                <button onClick={() => { setDistSlider(8.0); handleSimulate(8.0); }} className="px-3 py-1 text-xs rounded bg-red-600/30 text-red-300 border border-red-500 hover:bg-red-600/50">
                  🚨 Overload (8 cm)
                </button>
                <button onClick={() => { setDistSlider(20.0); handleSimulate(20.0); }} className="px-3 py-1 text-xs rounded bg-sky-600/30 text-sky-300 border border-sky-500 hover:bg-sky-600/50">
                  💧 High (20 cm)
                </button>
                <button onClick={() => { setDistSlider(70.0); handleSimulate(70.0); }} className="px-3 py-1 text-xs rounded bg-emerald-600/30 text-emerald-300 border border-emerald-500 hover:bg-emerald-600/50">
                  🟢 Normal (70 cm)
                </button>
                <button onClick={() => { setDistSlider(165.0); handleSimulate(165.0); }} className="px-3 py-1 text-xs rounded bg-amber-600/30 text-amber-300 border border-amber-500 hover:bg-amber-600/50">
                  ⚠️ Low (165 cm)
                </button>
                <button onClick={() => { setDistSlider(210.0); handleSimulate(210.0); }} className="px-3 py-1 text-xs rounded bg-rose-600/30 text-rose-300 border border-rose-500 hover:bg-rose-600/50">
                  🛑 Critical Low (210 cm)
                </button>
              </div>

              <button
                onClick={() => handleSimulate()}
                className="w-full py-2.5 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-sm shadow-lg shadow-cyan-600/20"
              >
                Inject Telemetry at {distSlider} cm
              </button>

              {simResult && (
                <div className="bg-scada-900/80 p-3 rounded-xl border border-scada-700 font-mono text-xs text-slate-300">
                  <div className="flex items-center justify-between text-cyan-400 font-bold mb-1">
                    <span>✓ Ingestion Status: 201 Created</span>
                    <span>Status: {simResult.telemetry_status}</span>
                  </div>
                  <div>Water Level: {simResult.water_percentage}% | Volume: {simResult.water_volume} L | Height: {simResult.water_height} cm</div>
                </div>
              )}
            </div>
          </div>

          {/* 2. Tank Geometry & Calibration Settings Form */}
          <div className="bg-scada-800 p-6 rounded-2xl border border-scada-700 shadow-xl space-y-4">
            <h3 className="text-lg font-bold text-white">Vessel Calibration & Dimensional Math</h3>
            <form onSubmit={handleSaveSettings} className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              <div>
                <label className="block text-xs text-slate-400 mb-1">Tank Name</label>
                <input
                  type="text"
                  value={tankForm.tank_name}
                  onChange={(e) => setTankForm({ ...tankForm, tank_name: e.target.value })}
                  className="w-full bg-scada-900 border border-scada-600 rounded-lg p-2.5 text-white"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Geometric Shape</label>
                <select
                  value={tankForm.shape}
                  onChange={(e) => setTankForm({ ...tankForm, shape: e.target.value })}
                  className="w-full bg-scada-900 border border-scada-600 rounded-lg p-2.5 text-white"
                >
                  <option value="cylinder">Vertical Cylinder (Overhead Sintex)</option>
                  <option value="rectangle">Rectangular (Ground Sump)</option>
                </select>
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Tank Height (cm)</label>
                <input
                  type="number"
                  step="0.1"
                  value={tankForm.tank_height_cm}
                  onChange={(e) => setTankForm({ ...tankForm, tank_height_cm: parseFloat(e.target.value) })}
                  className="w-full bg-scada-900 border border-scada-600 rounded-lg p-2.5 text-white font-mono"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Sensor Offset (cm above 100% mark)</label>
                <input
                  type="number"
                  step="0.1"
                  value={tankForm.sensor_offset_cm}
                  onChange={(e) => setTankForm({ ...tankForm, sensor_offset_cm: parseFloat(e.target.value) })}
                  className="w-full bg-scada-900 border border-scada-600 rounded-lg p-2.5 text-white font-mono"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Total Capacity (Litres)</label>
                <input
                  type="number"
                  step="1"
                  value={tankForm.total_capacity_litres}
                  onChange={(e) => setTankForm({ ...tankForm, total_capacity_litres: parseFloat(e.target.value) })}
                  className="w-full bg-scada-900 border border-scada-600 rounded-lg p-2.5 text-white font-mono"
                />
              </div>

              <div className="flex items-end">
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/20"
                >
                  Save Tank Settings
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // Root Application Component
    // =========================================================================
    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [summary, setSummary] = useState({});
      const [tanks, setTanks] = useState([]);
      const [devices, setDevices] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [selectedTankId, setSelectedTankId] = useState('');
      const [autoRefresh, setAutoRefresh] = useState(true);

      const fetchData = async () => {
        try {
          const [sumRes, tanksRes, devRes, alertsRes] = await Promise.all([
            API.getSummary(),
            API.getTanks(),
            API.getDevices(),
            API.getAlerts(true),
          ]);
          setSummary(sumRes || {});
          setTanks(tanksRes.tanks || []);
          setDevices(devRes.devices || []);
          setAlerts(alertsRes.alerts || []);

          if (!selectedTankId && tanksRes.tanks?.length > 0) {
            setSelectedTankId(tanksRes.tanks[0].tank_id);
          }
        } catch (err) {
          console.error("Data refresh failed:", err);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Auto-refresh interval (5 seconds)
      useEffect(() => {
        if (!autoRefresh) return;
        const timer = setInterval(fetchData, 5000);
        return () => clearInterval(timer);
      }, [autoRefresh, selectedTankId]);

      return (
        <div className="flex h-screen overflow-hidden">
          {/* Sidebar */}
          <Sidebar currentTab={currentTab} setCurrentTab={setCurrentTab} alertCount={alerts.length} />

          {/* Main Layout */}
          <div className="flex-1 flex flex-col min-w-0 bg-scada-900 overflow-y-auto">
            <Header
              tanks={tanks}
              selectedTankId={selectedTankId}
              setSelectedTankId={setSelectedTankId}
              autoRefresh={autoRefresh}
              setAutoRefresh={setAutoRefresh}
              onSimulateOpen={() => setCurrentTab('settings')}
              activeAlertCount={alerts.length}
            />

            <main className="flex-1">
              {currentTab === 'dashboard' && (
                <DashboardView
                  summary={summary}
                  tanks={tanks}
                  onSelectTank={(id) => { setSelectedTankId(id); setCurrentTab('tanks'); }}
                  onOpenSettings={() => setCurrentTab('settings')}
                />
              )}

              {currentTab === 'tanks' && (
                <div className="p-6">
                  <div className="mb-6 flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-bold text-white">Live Vessel Deep-Dive Telemetry</h2>
                      <p className="text-xs text-slate-400">High-resolution physical SCADA cross-section & sensor telemetry</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center bg-scada-800 p-8 rounded-2xl border border-scada-700">
                    <div className="flex justify-center">
                      {tanks.find(t => t.tank_id === selectedTankId) && (
                        <FluidTankVisualizer
                          percentage={tanks.find(t => t.tank_id === selectedTankId).current_percentage}
                          status={tanks.find(t => t.tank_id === selectedTankId).status}
                          heightCm={tanks.find(t => t.tank_id === selectedTankId).tank_height_cm}
                          airGapCm={tanks.find(t => t.tank_id === selectedTankId).latest_reading?.distance_cm || 30.0}
                          isOverloaded={tanks.find(t => t.tank_id === selectedTankId).is_overloaded}
                          compact={false}
                        />
                      )}
                    </div>
                    <div className="space-y-4 font-mono text-sm text-slate-300">
                      <h3 className="text-lg font-bold text-white font-sans">Physics & Volumetric Formula</h3>
                      <div className="p-4 bg-scada-900 rounded-xl space-y-2 border border-scada-700">
                        <div>Water Height = Tank Height - Air Gap</div>
                        <div className="text-cyan-400 font-bold">
                          = {tanks.find(t => t.tank_id === selectedTankId)?.tank_height_cm} cm - {(tanks.find(t => t.tank_id === selectedTankId)?.latest_reading?.distance_cm || 0).toFixed(1)} cm
                        </div>
                        <div className="pt-2 border-t border-scada-700/60">Fill Ratio = (Water Height / Total Height) × 100</div>
                        <div className="text-emerald-400 font-bold">
                          = {(tanks.find(t => t.tank_id === selectedTankId)?.current_percentage || 0).toFixed(1)}%
                        </div>
                        <div className="pt-2 border-t border-scada-700/60">Volume in Litres = Fill Ratio × Total Capacity</div>
                        <div className="text-blue-400 font-bold">
                          = {Math.round(tanks.find(t => t.tank_id === selectedTankId)?.current_volume_litres || 0)} Litres
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {currentTab === 'analytics' && (
                <AnalyticsView tanks={tanks} selectedTankId={selectedTankId} />
              )}

              {currentTab === 'devices' && (
                <DeviceManagementView devices={devices} tanks={tanks} onReload={fetchData} />
              )}

              {currentTab === 'alerts' && (
                <AlertsView alerts={alerts} onReload={fetchData} />
              )}

              {currentTab === 'settings' && (
                <SettingsSimulatorView tanks={tanks} selectedTankId={selectedTankId} onReload={fetchData} />
              )}
            </main>
          </div>
        </div>
      );
    }

    // Render the React App into the DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
