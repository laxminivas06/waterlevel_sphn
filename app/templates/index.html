<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDRO SENSE — Sphoorthy Engineering College | Smart Water Tank Monitor</title>

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/png" href="https://aivontraa.com/assets/images/ai.png">
  <link rel="apple-touch-icon" href="https://aivontraa.com/assets/images/ai.png">

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Chart.js for Historical Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- React 18 & Babel for Zero-Build Standalone Deployment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#0a0f1d',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* SCADA Wave & Pulse Animations */
    @keyframes waveMotionFront {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-25%);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes waveMotionBack {
      0% {
        transform: translateX(-50%);
      }

      50% {
        transform: translateX(-25%);
      }

      100% {
        transform: translateX(0);
      }
    }

    @keyframes sonarWave {
      0% {
        opacity: 0.9;
        stroke-dashoffset: 0;
      }

      100% {
        opacity: 0.1;
        stroke-dashoffset: 40;
      }
    }

    .wave-front {
      animation: waveMotionFront 6s linear infinite;
    }

    .wave-back {
      animation: waveMotionBack 8s linear infinite;
    }

    .sonar-beam {
      animation: sonarWave 1.8s linear infinite;
    }

    /* Modern Light Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body
  class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white flex flex-col">

  <!-- Root React Mount Container -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React 18 Application Script -->
  {% raw %}
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // API Client Helper
    // =========================================================================
    const API = {
      async getCurrent() {
        const res = await fetch('/api/water-level/current');
        return await res.json();
      },
      async getTankHistory(tankId, range = '24h') {
        const res = await fetch(`/api/v1/tanks/${tankId}/history?range=${range}`);
        return await res.json();
      },
      async saveTank(data) {
        const res = await fetch('/api/v1/tanks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return await res.json();
      },
      async getRecipients() {
        const res = await fetch('/api/v1/settings/email/recipients');
        return await res.json();
      },
      async addRecipient(email) {
        const res = await fetch('/api/v1/settings/email/recipients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        return await res.json();
      },
      async editRecipient(oldEmail, newEmail) {
        const res = await fetch('/api/v1/settings/email/recipients', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_email: oldEmail, new_email: newEmail }),
        });
        return await res.json();
      },
      async deleteRecipient(email) {
        const res = await fetch('/api/v1/settings/email/recipients', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        return await res.json();
      },
      async getMaintenanceStatus() {
        const res = await fetch('/api/v1/maintenance/status');
        return await res.json();
      },
      async runMaintenance(force = false) {
        const res = await fetch(`/api/v1/maintenance/run?force=${force}`, { method: 'POST' });
        return await res.json();
      }
    };

    // =========================================================================
    // Responsive SVG Fluid Tank Component (Compact SCADA Gauge)
    // =========================================================================
    function FluidTankVisualizer({ percentage = 0, status = 'NORMAL', airGapCm = 0, isOverloaded = false }) {
      const clampedPct = Math.min(105, Math.max(0, percentage));

      // ViewBox: 240 width, 300 height. Tank liquid range: y=38 (100%) to y=260 (0%)
      const tankTopY = 38;
      const tankBottomY = 260;
      const usableHeight = tankBottomY - tankTopY; // 222px
      const liquidH = (clampedPct / 100) * usableHeight;
      const liquidY = tankBottomY - liquidH;
      // Proportional wave scaling prevents wave distortion at low levels (e.g. 2% shows exactly 2%)
      const waveScaleY = Math.min(1.0, Math.max(0.05, clampedPct / 18.0));

      let gradStart = '#0284c7';
      let gradEnd = '#0369a1';
      let statusBadge = 'bg-cyan-50 text-cyan-700 border-cyan-200';

      if (isOverloaded || status === 'OVERLOADED') {
        gradStart = '#ef4444';
        gradEnd = '#b91c1c';
        statusBadge = 'bg-red-50 text-red-700 border-red-300 animate-pulse';
      } else if (status === 'CRITICAL LOW') {
        gradStart = '#f87171';
        gradEnd = '#dc2626';
        statusBadge = 'bg-rose-50 text-rose-700 border-rose-300 animate-pulse';
      } else if (status === 'LOW') {
        gradStart = '#fbbf24';
        gradEnd = '#d97706';
        statusBadge = 'bg-amber-50 text-amber-700 border-amber-300';
      } else if (status === 'HIGH') {
        gradStart = '#0284c7';
        gradEnd = '#0369a1';
        statusBadge = 'bg-blue-50 text-blue-700 border-blue-300';
      } else {
        gradStart = '#10b981';
        gradEnd = '#059669';
        statusBadge = 'bg-emerald-50 text-emerald-700 border-emerald-300';
      }

      // Dynamic high-contrast readout
      const isTextSubmerged = liquidY <= 140;
      const textColor = isTextSubmerged ? '#ffffff' : '#0f172a';
      const subTextColor = isTextSubmerged ? '#e0f2fe' : '#475569';
      const textShadow = isTextSubmerged ? 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))' : 'drop-shadow(0 1px 1px rgba(255,255,255,0.8))';

      return (
        <div className="flex flex-col items-center w-full">
          <div className="w-full max-w-[210px] sm:max-w-[230px] aspect-[4/5]">
            <svg viewBox="0 0 240 300" className="w-full h-full drop-shadow-sm">
              <defs>
                <linearGradient id={`tankLiquidGrad-${Math.round(clampedPct)}`} x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor={gradStart} />
                  <stop offset="100%" stopColor={gradEnd} />
                </linearGradient>

                <linearGradient id="tankGlassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#ffffff" stopOpacity="0.3" />
                  <stop offset="35%" stopColor="#ffffff" stopOpacity="0.06" />
                  <stop offset="70%" stopColor="#000000" stopOpacity="0.03" />
                  <stop offset="100%" stopColor="#ffffff" stopOpacity="0.18" />
                </linearGradient>

                <clipPath id="tankInnerClip">
                  <rect x="35" y="38" width="170" height="222" rx="14" ry="14" />
                </clipPath>
              </defs>

              {/* Sensor Housing at Tank Top */}
              <rect x="85" y="14" width="70" height="18" rx="5" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="2" />
              <circle cx="102" cy="23" r="4" fill="#e2e8f0" stroke="#94a3b8" strokeWidth="1.5" />
              <circle cx="138" cy="23" r="4" fill="#e2e8f0" stroke="#94a3b8" strokeWidth="1.5" />

              {/* Ultrasonic Pulse Ray Beam down to water level */}
              <line x1="120" y1="32" x2="120" y2={clampedPct > 0 ? liquidY : tankBottomY} stroke="#0284c7" strokeWidth="2.5" strokeDasharray="6 4" className="sonar-beam" />

              {/* Outer Tank Glass Vessel */}
              <rect x="35" y="38" width="170" height="222" rx="14" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="2.5" />

              {/* Clipped Liquid Interior - Accurately sized to exact fill percentage */}
              {clampedPct > 0 && (
                <g clipPath="url(#tankInnerClip)">
                  <rect x="35" y={liquidY} width="170" height={Math.max(0, tankBottomY - liquidY + 2)} fill={`url(#tankLiquidGrad-${Math.round(clampedPct)})`} />

                  {/* Back Wave */}
                  <g transform={`translate(0, ${liquidY}) scale(1, ${waveScaleY})`}>
                    <path className="wave-back opacity-45" fill={gradEnd}
                      d="M-200,0 C-150,-10 -100,10 -50,0 C0,-10 50,10 100,0 C150,-10 200,10 250,0 C300,-10 350,10 400,0 L400,50 L-200,50 Z" />
                  </g>

                  {/* Front Wave */}
                  <g transform={`translate(0, ${liquidY}) scale(1, ${waveScaleY})`}>
                    <path className="wave-front opacity-80" fill={`url(#tankLiquidGrad-${Math.round(clampedPct)})`}
                      d="M-200,0 C-140,7 -80,-7 -20,0 C40,7 100,-7 160,0 C220,7 280,-7 340,0 C400,7 460,-7 520,0 L520,50 L-200,50 Z" />
                  </g>

                  {/* Glass Reflection Highlight */}
                  <rect x="35" y="38" width="170" height="222" fill="url(#tankGlassSheen)" pointerEvents="none" />
                </g>
              )}

              {/* Measurement Scale Marks */}
              <g stroke="#94a3b8" strokeWidth="1.5">
                <line x1="26" y1="38" x2="35" y2="38" />
                <text x="22" y="41" fontSize="9" fill="#475569" textAnchor="end" className="font-mono font-semibold">100%</text>

                <line x1="28" y1="93" x2="35" y2="93" />
                <text x="22" y="96" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">75%</text>

                <line x1="26" y1="149" x2="35" y2="149" />
                <text x="22" y="152" fontSize="9" fill="#475569" textAnchor="end" className="font-mono font-semibold">50%</text>

                <line x1="28" y1="204" x2="35" y2="204" />
                <text x="22" y="207" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">25%</text>

                <line x1="26" y1="260" x2="35" y2="260" />
                <text x="22" y="263" fontSize="9" fill="#475569" textAnchor="end" className="font-mono font-semibold">0%</text>
              </g>

              {/* Tank Stand Feet */}
              <rect x="65" y="264" width="110" height="9" rx="3" fill="#cbd5e1" stroke="#94a3b8" strokeWidth="1.5" />
              <rect x="52" y="273" width="136" height="5" rx="2" fill="#94a3b8" />

              {/* Central Digital Readout */}
              <g textAnchor="middle">
                <text x="120" y="140" className="font-mono font-extrabold text-3xl" fill={textColor} filter={textShadow}>
                  {clampedPct.toFixed(1)}%
                </text>
                <text x="120" y="162" className="font-mono text-xs font-semibold" fill={subTextColor} filter={textShadow}>
                  Air Gap: {airGapCm.toFixed(1)} cm
                </text>
              </g>

              {/* Overload Alert Tag */}
              {isOverloaded && (
                <g transform="translate(45, 95)">
                  <rect width="150" height="28" rx="6" fill="#dc2626" opacity="0.95" stroke="#ffffff" strokeWidth="1.5" className="animate-pulse" />
                  <text x="75" y="19" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle" className="font-mono">
                    ⚠️ OVERFLOW RISK
                  </text>
                </g>
              )}
            </svg>
          </div>

          {/* Status Pill Badge */}
          <div className={`mt-2 px-3.5 py-1 rounded-full text-xs font-bold tracking-wider uppercase border shadow-sm ${statusBadge}`}>
            {status}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Main Compact Dashboard Application - Sphoorthy Engineering College
    // =========================================================================
    function App() {
      const [data, setData] = useState(null);
      const [history, setHistory] = useState([]);
      const [historyRange, setHistoryRange] = useState('24h');
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [settingsTab, setSettingsTab] = useState('recipients'); // 'recipients', 'geometry', 'storage'

      // Analytics View State: Chart vs Tabular View
      const [analyticsView, setAnalyticsView] = useState('chart'); // 'chart' or 'table'
      const [tableFilter, setTableFilter] = useState('');

      // Tank Geometry State (Supports up to 5 Lakh Litres)
      const [tankCapacityInput, setTankCapacityInput] = useState(500000);

      // Email Receiver Management State
      const [recipientsList, setRecipientsList] = useState([]);
      const [newEmailInput, setNewEmailInput] = useState('');
      const [editingEmailId, setEditingEmailId] = useState(null);
      const [editingEmailValue, setEditingEmailValue] = useState('');
      const [emailActionMsg, setEmailActionMsg] = useState(null);
      const [deleteTargetEmail, setDeleteTargetEmail] = useState(null);

      // Automated 15-Day Backup & 45-Day Retention State
      const [maintenanceStatus, setMaintenanceStatus] = useState(null);
      const [backupCreating, setBackupCreating] = useState(false);
      const [backupMsg, setBackupMsg] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Time & Date Formatter Helpers (Indian Standard Time - IST)
      const formatTimeIST = (ts) => {
        if (!ts) return 'Live Active';
        const s = String(ts).replace('T', ' ');
        if (s.length >= 19) {
          const [hh, mm, ss] = s.slice(11, 19).split(':');
          let h = parseInt(hh, 10);
          const ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12;
          const hPad = h < 10 ? '0' + h : h;
          return `${hPad}:${mm}:${ss} ${ampm}`;
        }
        return s;
      };

      const formatDateTimeIST = (ts) => {
        if (!ts) return 'N/A';
        const s = String(ts).replace('T', ' ');
        if (s.length >= 10) {
          const datePart = s.slice(0, 10);
          if (s.length >= 19) {
            return `${datePart} ${formatTimeIST(s)}`;
          }
          return datePart;
        }
        return s;
      };

      const getStatusPillClass = (st) => {
        const s = String(st || 'NORMAL').toUpperCase();
        if (s === 'OVERLOADED') return 'bg-red-100 text-red-800 border border-red-200';
        if (s === 'CRITICAL LOW') return 'bg-rose-100 text-rose-800 border border-rose-200';
        if (s === 'LOW') return 'bg-amber-100 text-amber-800 border border-amber-200';
        if (s === 'HIGH') return 'bg-blue-100 text-blue-800 border border-blue-200';
        return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
      };

      // Export visible readings as CSV
      const handleExportCSV = () => {
        if (!history || !history.length) return;
        const headers = ['ID', 'Device ID', 'Tank ID', 'Timestamp (IST)', 'Date', 'Water Level (%)', 'Volume (L)', 'Depth (cm)', 'Air Gap (cm)', 'Status'];
        const rows = history.map(r => [
          r.id || '',
          `"${r.device_id || ''}"`,
          `"${r.tank_id || ''}"`,
          `"${formatDateTimeIST(r.timestamp)}"`,
          `"${r.date || ''}"`,
          r.water_percentage !== undefined ? r.water_percentage : '',
          r.water_volume !== undefined ? r.water_volume : '',
          r.water_height !== undefined ? r.water_height : '',
          r.distance_cm !== undefined ? r.distance_cm : '',
          `"${r.status || 'NORMAL'}"`
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `hydrosense_telemetry_${historyRange}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Filtered past readings for Tabular View (Newest first)
      const filteredTableHistory = React.useMemo(() => {
        const sorted = [...history].sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
        const term = tableFilter.trim().toLowerCase();
        if (!term) return sorted;
        return sorted.filter(r =>
          String(r.timestamp || '').toLowerCase().includes(term) ||
          String(r.status || '').toLowerCase().includes(term) ||
          String(r.water_percentage || '').includes(term) ||
          String(r.water_volume || '').includes(term) ||
          String(r.date || '').toLowerCase().includes(term)
        );
      }, [history, tableFilter]);

      // Fetch Live Telemetry Data
      const fetchLiveData = async () => {
        try {
          const res = await API.getCurrent();
          setData(res);
        } catch (err) {
          console.error('Failed to fetch live water data:', err);
        }
      };

      // Fetch History for Analytics Chart
      const fetchHistory = async () => {
        if (!data || !data.tank) return;
        try {
          const res = await API.getTankHistory(data.tank.tank_id, historyRange);
          setHistory(res.data || []);
        } catch (err) {
          console.error('Failed to load history:', err);
        }
      };

      // Fetch Email Recipients
      const fetchRecipients = async () => {
        try {
          const res = await API.getRecipients();
          if (res && res.recipients) {
            setRecipientsList(res.recipients);
          }
        } catch (err) {
          console.error('Failed to load recipients:', err);
        }
      };

      // Fetch 15-day backup & 45-day retention status
      const fetchMaintenanceStatus = async () => {
        try {
          const res = await API.getMaintenanceStatus();
          setMaintenanceStatus(res);
        } catch (err) {
          console.error('Failed to load maintenance status:', err);
        }
      };

      // Polling effect
      useEffect(() => {
        fetchLiveData();
        fetchRecipients();
        fetchMaintenanceStatus();
        const interval = setInterval(() => {
          if (autoRefresh) fetchLiveData();
        }, 5000);
        return () => clearInterval(interval);
      }, [autoRefresh]);

      useEffect(() => {
        if (data?.tank) {
          fetchHistory();
        }
      }, [data?.tank?.tank_id, historyRange]);

      useEffect(() => {
        if (data?.tank?.total_capacity_litres) {
          setTankCapacityInput(data.tank.total_capacity_litres);
        }
      }, [data?.tank?.total_capacity_litres]);

      // Chart.js Render (Re-rendered on history updates or switching to chart view)
      useEffect(() => {
        if (analyticsView !== 'chart' || !chartRef.current || !history.length) return;

        const ctx = chartRef.current.getContext('2d');
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = history.map(h => {
          const raw = h.timestamp || '';
          if (raw.length >= 16) {
            const [hh, mm] = raw.slice(11, 16).split(':');
            let hNum = parseInt(hh, 10);
            const ampm = hNum >= 12 ? 'PM' : 'AM';
            hNum = hNum % 12 || 12;
            return `${hNum}:${mm} ${ampm}`;
          }
          return h.date || raw;
        });
        const percentages = history.map(h => h.water_percentage);

        const gradient = ctx.createLinearGradient(0, 0, 0, 180);
        gradient.addColorStop(0, 'rgba(2, 132, 199, 0.25)');
        gradient.addColorStop(1, 'rgba(2, 132, 199, 0.0)');

        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Water Level (%)',
              data: percentages,
              borderColor: '#0284c7',
              backgroundColor: gradient,
              borderWidth: 2,
              tension: 0.35,
              fill: true,
              pointRadius: labels.length > 25 ? 0 : 2.5,
              pointHoverRadius: 5,
              pointBackgroundColor: '#0284c7',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#ffffff',
                titleColor: '#0f172a',
                bodyColor: '#0284c7',
                borderColor: '#cbd5e1',
                borderWidth: 1,
                padding: 8,
                callbacks: {
                  title: (items) => {
                    const item = items[0];
                    const pt = history[item.dataIndex] || {};
                    return formatDateTimeIST(pt.timestamp) + ' (IST)';
                  },
                  label: (item) => {
                    const pt = history[item.dataIndex] || {};
                    return `Level: ${item.raw.toFixed(1)}% • ${Math.round(pt.water_volume || 0).toLocaleString('en-IN')} L`;
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(226, 232, 240, 0.7)' },
                ticks: { color: '#64748b', maxTicksLimit: 7, font: { size: 9 } }
              },
              y: {
                min: 0,
                max: 100,
                grid: { color: 'rgba(226, 232, 240, 0.7)' },
                ticks: {
                  color: '#64748b',
                  stepSize: 25,
                  callback: (val) => `${val}%`,
                  font: { size: 9 }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [history, analyticsView]);

      // Recipient CRUD Handlers
      const handleAddRecipient = async () => {
        const trimmed = newEmailInput.trim();
        if (!trimmed || !trimmed.includes('@') || !trimmed.includes('.')) {
          setEmailActionMsg({ type: 'error', text: 'Please enter a valid email address.' });
          return;
        }
        setEmailActionMsg(null);
        const res = await API.addRecipient(trimmed);
        if (res.success) {
          setRecipientsList(res.recipients);
          setNewEmailInput('');
          setEmailActionMsg({ type: 'success', text: res.message });
        } else {
          setEmailActionMsg({ type: 'error', text: res.error || 'Failed to add recipient.' });
        }
      };

      const handleSaveEditRecipient = async (oldEmail) => {
        const trimmed = editingEmailValue.trim();
        if (!trimmed || !trimmed.includes('@') || !trimmed.includes('.')) {
          setEmailActionMsg({ type: 'error', text: 'Please enter a valid replacement email.' });
          return;
        }
        setEmailActionMsg(null);
        const res = await API.editRecipient(oldEmail, trimmed);
        if (res.success) {

                        shape: form.shape.value,
                        total_capacity_litres: parseFloat(form.total_capacity_litres.value),

                        sensor_offset_cm: parseFloat(form.sensor_offset_cm.value),
                        low_percent: parseFloat(form.low_percent.value),
                        critical_low_percent: parseFloat(form.critical_low_percent.value),
                        high_percent: parseFloat(form.high_percent.value),
                      };
                      await API.saveTank(payload);
                      await fetchLiveData();
                      setIsSettingsOpen(false);

                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            <span>Creating Backup...</span>
                          </>
                        ) : (
                          <>
                            <span>💾</span>
                            <span>Create Backup Snapshot Now</span>
                          </>

                      </button>
                    </div>

                )}

              </div>
            </div>
          )}

          {deleteTargetEmail && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-center">
                <div className="w-11 h-11 rounded-full bg-red-50 border border-red-200 flex items-center justify-center mx-auto text-xl">

                  <h3 className="font-bold text-slate-900 text-sm">Confirm Receiver Removal</h3>

                </div>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setDeleteTargetEmail(null)}
                    className="flex-1 py-2 px-3 rounded-xl border border-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-50"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteRecipient}
                    className="flex-1 py-2 px-3 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-sm"
                  >
                    Yes, Remove
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React App into the DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  {% endraw %}
