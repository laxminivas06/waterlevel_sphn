<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroSense IoT - Smart Water Tank Monitor</title>
  
  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/png" href="https://aivontraa.com/assets/images/ai.png">
  <link rel="apple-touch-icon" href="https://aivontraa.com/assets/images/ai.png">
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Chart.js for Historical Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- React 18 & Babel for Zero-Build Standalone Deployment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            scada: {
              accent: '#06b6d4',
              accentHover: '#0891b2',
              normal: '#10b981',
              warning: '#f59e0b',
              critical: '#ef4444',
              overload: '#dc2626',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* SCADA Wave & Pulse Animations */
    @keyframes waveMotionFront {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(-50%); }
    }
    @keyframes waveMotionBack {
      0% { transform: translateX(-50%); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(0); }
    }
    @keyframes sonarWave {
      0% { opacity: 0.9; stroke-dashoffset: 0; }
      100% { opacity: 0.1; stroke-dashoffset: 40; }
    }
    .wave-front {
      animation: waveMotionFront 6s linear infinite;
    }
    .wave-back {
      animation: waveMotionBack 8s linear infinite;
    }
    .sonar-beam {
      animation: sonarWave 1.8s linear infinite;
    }

    /* Modern Light Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white flex flex-col">

  <!-- Root React Mount Container -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React 18 Application Script -->
  {% raw %}
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // API Client Helper
    // =========================================================================
    const API = {
      async getCurrent() {
        const res = await fetch('/api/water-level/current');
        return res.json();
      },
      async getTankHistory(tankId, range = '24h') {
        const res = await fetch(`/api/v1/tanks/${tankId}/history?range=${range}`);
        return res.json();
      },
      async saveTank(data) {
        const res = await fetch('/api/v1/tanks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      },
      async sendTestEmail(data) {
        const res = await fetch('/api/v1/email/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      },
      async simulate(data) {
        const res = await fetch('/api/v1/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      }
    };

    // =========================================================================
    // Responsive SVG Fluid Tank Component (Light Theme SCADA Gauge)
    // =========================================================================
    function FluidTankVisualizer({ percentage = 0, status = 'NORMAL', airGapCm = 0, isOverloaded = false }) {
      const clampedPct = Math.min(105, Math.max(0, percentage));
      
      // ViewBox: 240 width, 320 height. Tank liquid range: y=40 (100%) to y=280 (0%)
      const tankTopY = 40;
      const tankBottomY = 280;
      const usableHeight = tankBottomY - tankTopY; // 240px
      const liquidH = (clampedPct / 100) * usableHeight;
      const liquidY = tankBottomY - liquidH;
      // Proportional wave scaling prevents wave distortion at low levels (e.g. 2% shows exactly 2%)
      const waveScaleY = Math.min(1.0, Math.max(0.05, clampedPct / 18.0));

      // Dynamic Colors based on status
      let gradStart = '#06b6d4';
      let gradEnd = '#0284c7';
      let statusBadge = 'bg-cyan-50 text-cyan-700 border-cyan-200';

      if (isOverloaded || status === 'OVERLOADED') {
        gradStart = '#ef4444';
        gradEnd = '#b91c1c';
        statusBadge = 'bg-red-50 text-red-700 border-red-300 animate-pulse';
      } else if (status === 'CRITICAL LOW') {
        gradStart = '#f87171';
        gradEnd = '#dc2626';
        statusBadge = 'bg-rose-50 text-rose-700 border-rose-300 animate-pulse';
      } else if (status === 'LOW') {
        gradStart = '#fbbf24';
        gradEnd = '#d97706';
        statusBadge = 'bg-amber-50 text-amber-700 border-amber-300';
      } else if (status === 'HIGH') {
        gradStart = '#0284c7';
        gradEnd = '#0369a1';
        statusBadge = 'bg-blue-50 text-blue-700 border-blue-300';
      } else {
        gradStart = '#10b981';
        gradEnd = '#059669';
        statusBadge = 'bg-emerald-50 text-emerald-700 border-emerald-300';
      }

      // Check whether digital readout at y=150 is submerged in liquid or over air
      const isTextSubmerged = liquidY <= 150;
      const textColor = isTextSubmerged ? '#ffffff' : '#0f172a';
      const subTextColor = isTextSubmerged ? '#e0f2fe' : '#475569';
      const textShadow = isTextSubmerged ? 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))' : 'drop-shadow(0 1px 1px rgba(255,255,255,0.8))';

      return (
        <div className="flex flex-col items-center w-full">
          <div className="w-full max-w-[240px] sm:max-w-[270px] aspect-[3/4]">
            <svg viewBox="0 0 240 320" className="w-full h-full drop-shadow-md">
              <defs>
                <linearGradient id={`tankLiquidGrad-${Math.round(clampedPct)}`} x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor={gradStart} />
                  <stop offset="100%" stopColor={gradEnd} />
                </linearGradient>

                <linearGradient id="tankGlassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#ffffff" stopOpacity="0.35" />
                  <stop offset="35%" stopColor="#ffffff" stopOpacity="0.08" />
                  <stop offset="70%" stopColor="#000000" stopOpacity="0.04" />
                  <stop offset="100%" stopColor="#ffffff" stopOpacity="0.2" />
                </linearGradient>

                <clipPath id="tankInnerClip">
                  <rect x="35" y="40" width="170" height="240" rx="18" ry="18" />
                </clipPath>
              </defs>

              {/* Sensor Housing at Tank Top */}
              <rect x="85" y="16" width="70" height="18" rx="5" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="2" />
              <circle cx="102" cy="25" r="4.5" fill="#e2e8f0" stroke="#94a3b8" strokeWidth="1.5" />
              <circle cx="138" cy="25" r="4.5" fill="#e2e8f0" stroke="#94a3b8" strokeWidth="1.5" />
              
              {/* Sonic Pulse Ray Beam down to water level */}
              <line x1="120" y1="34" x2="120" y2={clampedPct > 0 ? liquidY : tankBottomY} stroke="#0284c7" strokeWidth="2.5" strokeDasharray="6 4" className="sonar-beam" />
              
              {/* Outer Tank Glass Vessel (Light SCADA Frosted Vessel) */}
              <rect x="35" y="40" width="170" height="240" rx="18" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="3" />

              {/* Clipped Liquid Interior - Accurately sized to exact fill percentage */}
              {clampedPct > 0 && (
                <g clipPath="url(#tankInnerClip)">
                  <rect x="35" y={liquidY} width="170" height={Math.max(0, tankBottomY - liquidY + 2)} fill={`url(#tankLiquidGrad-${Math.round(clampedPct)})`} />
                  
                  {/* Back Wave */}
                  <g transform={`translate(0, ${liquidY}) scale(1, ${waveScaleY})`}>
                    <path className="wave-back opacity-50" fill={gradEnd}
                      d="M-200,0 C-150,-10 -100,10 -50,0 C0,-10 50,10 100,0 C150,-10 200,10 250,0 C300,-10 350,10 400,0 L400,60 L-200,60 Z" />
                  </g>

                  {/* Front Wave */}
                  <g transform={`translate(0, ${liquidY}) scale(1, ${waveScaleY})`}>
                    <path className="wave-front opacity-80" fill={`url(#tankLiquidGrad-${Math.round(clampedPct)})`}
                      d="M-200,0 C-140,8 -80,-8 -20,0 C40,8 100,-8 160,0 C220,8 280,-8 340,0 C400,8 460,-8 520,0 L520,60 L-200,60 Z" />
                  </g>

                  {/* Glass Reflection Highlight */}
                  <rect x="35" y="40" width="170" height="240" fill="url(#tankGlassSheen)" pointerEvents="none" />
                </g>
              )}

              {/* Measurement Scale Marks */}
              <g stroke="#94a3b8" strokeWidth="1.5">
                <line x1="26" y1="40" x2="35" y2="40" />
                <text x="22" y="43" fontSize="9" fill="#475569" textAnchor="end" className="font-mono font-semibold">100%</text>

                <line x1="28" y1="100" x2="35" y2="100" />
                <text x="22" y="103" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">75%</text>

                <line x1="26" y1="160" x2="35" y2="160" />
                <text x="22" y="163" fontSize="9" fill="#475569" textAnchor="end" className="font-mono font-semibold">50%</text>

                <line x1="28" y1="220" x2="35" y2="220" />
                <text x="22" y="223" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">25%</text>

                <line x1="26" y1="280" x2="35" y2="280" />
                <text x="22" y="283" fontSize="9" fill="#475569" textAnchor="end" className="font-mono font-semibold">0%</text>
              </g>

              {/* Tank Stand Feet */}
              <rect x="65" y="284" width="110" height="10" rx="3" fill="#cbd5e1" stroke="#94a3b8" strokeWidth="1.5" />
              <rect x="50" y="294" width="140" height="5" rx="2" fill="#94a3b8" />

              {/* Central Digital Readout (Dynamic High Contrast for Light SCADA) */}
              <g textAnchor="middle">
                <text x="120" y="150" className="font-mono font-extrabold text-3xl sm:text-4xl" fill={textColor} filter={textShadow}>
                  {clampedPct.toFixed(1)}%
                </text>
                <text x="120" y="174" className="font-mono text-xs font-semibold" fill={subTextColor} filter={textShadow}>
                  Air Gap: {airGapCm.toFixed(1)} cm
                </text>
              </g>

              {/* Overload Alert Tag */}
              {isOverloaded && (
                <g transform="translate(45, 105)">
                  <rect width="150" height="30" rx="6" fill="#dc2626" opacity="0.95" stroke="#ffffff" strokeWidth="1.5" className="animate-pulse" />
                  <text x="75" y="20" fill="#ffffff" fontSize="12" fontWeight="bold" textAnchor="middle" className="font-mono">
                    ⚠️ OVERFLOW RISK
                  </text>
                </g>
              )}
            </svg>
          </div>

          {/* Status Pill Badge */}
          <div className={`mt-3 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase border shadow-sm ${statusBadge}`}>
            {status}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Main Single-Tank Responsive Dashboard Application (Full Light Theme)
    // =========================================================================
    function App() {
      const [data, setData] = useState(null);
      const [history, setHistory] = useState([]);
      const [historyRange, setHistoryRange] = useState('24h');
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [loading, setLoading] = useState(true);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [emailTesting, setEmailTesting] = useState(false);
      const [emailTestResult, setEmailTestResult] = useState(null);
      const [receiverEmailsList, setReceiverEmailsList] = useState(['hello.aivontraa@gmail.com']);
      const [newEmailInput, setNewEmailInput] = useState('');

      const handleAddReceiverEmail = () => {
        const trimmed = newEmailInput.trim();
        if (!trimmed) return;
        if (!trimmed.includes('@') || !trimmed.includes('.')) {
          alert('Please enter a valid email address.');
          return;
        }
        if (!receiverEmailsList.map(e => e.toLowerCase()).includes(trimmed.toLowerCase())) {
          setReceiverEmailsList([...receiverEmailsList, trimmed]);
        }
        setNewEmailInput('');
      };

      const handleRemoveReceiverEmail = (index) => {
        if (receiverEmailsList.length <= 1) return;
        setReceiverEmailsList(receiverEmailsList.filter((_, i) => i !== index));
      };

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Load live telemetry data
      const fetchLiveData = async () => {
        try {
          const res = await API.getCurrent();
          setData(res);
          setLoading(false);
        } catch (err) {
          console.error('Failed to fetch live water level data:', err);
        }
      };

      // Load historical data for chart
      const fetchHistory = async () => {
        if (!data || !data.tank) return;
        try {
          const res = await API.getTankHistory(data.tank.tank_id, historyRange);
          setHistory(res.data || []);
        } catch (err) {
          console.error('Failed to load history:', err);
        }
      };

      // Initial load and live polling timer
      useEffect(() => {
        fetchLiveData();
        const interval = setInterval(() => {
          if (autoRefresh) fetchLiveData();
        }, 5000);
        return () => clearInterval(interval);
      }, [autoRefresh]);

      useEffect(() => {
        if (data && data.tank) {
          fetchHistory();
        }
      }, [data?.tank?.tank_id, historyRange]);

      // Synchronize receiver emails when data loads
      useEffect(() => {
        if (data?.email_settings?.recipient_emails) {
          const list = data.email_settings.recipient_emails
            .split(/[,;\s]+/)
            .map(e => e.trim())
            .filter(e => e && e.includes('@'));
          if (list.length > 0) {
            setReceiverEmailsList(list);
          }
        }
      }, [data?.email_settings?.recipient_emails]);

      // Render & update Chart.js with clean light theme styling
      useEffect(() => {
        if (!chartRef.current || !history.length) return;

        const ctx = chartRef.current.getContext('2d');
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = history.map(h => (h.timestamp || '').slice(11, 16) || h.date);
        const percentages = history.map(h => h.water_percentage);

        // Chart gradient fill
        const gradient = ctx.createLinearGradient(0, 0, 0, 260);
        gradient.addColorStop(0, 'rgba(6, 182, 212, 0.25)');
        gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Water Level (%)',
              data: percentages,
              borderColor: '#0284c7',
              backgroundColor: gradient,
              borderWidth: 2.5,
              tension: 0.35,
              fill: true,
              pointRadius: labels.length > 30 ? 0 : 3,
              pointHoverRadius: 6,
              pointBackgroundColor: '#0284c7',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#ffffff',
                titleColor: '#0f172a',
                bodyColor: '#0284c7',
                borderColor: '#cbd5e1',
                borderWidth: 1,
                padding: 10,
                callbacks: {
                  label: (item) => `Level: ${item.raw.toFixed(1)}%`
                }
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(226, 232, 240, 0.8)' },
                ticks: { color: '#64748b', maxTicksLimit: 8, font: { size: 10 } }
              },
              y: {
                min: 0,
                max: 100,
                grid: { color: 'rgba(226, 232, 240, 0.8)' },
                ticks: {
                  color: '#64748b',
                  stepSize: 25,
                  callback: (val) => `${val}%`,
                  font: { size: 10 }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [history]);

      // Calculate state helpers
      const tank = data?.tank || {};
      const reading = data?.reading || {};
      const device = data?.device || {};
      const todaySummary = data?.today_summary || {};

      const pct = data?.water_percentage || 0;
      const vol = data?.water_volume_litres || 0;
      const depth = data?.water_level || reading?.water_height || 0;
      const distance = reading?.distance_cm || 0;
      const capacity = tank?.total_capacity_litres || 1000;
      const remainingL = Math.max(0, capacity - vol);
      const isOnline = data?.is_online || (device?.status === 'online');
      const statusText = reading?.status || tank?.level_state?.toUpperCase() || 'NORMAL';
      const isOverloaded = (statusText === 'OVERLOADED');
      const emailSettings = data?.email_settings || {};
      const recipientEmails = emailSettings?.recipient_emails || 'hello.aivontraa@gmail.com';

      // Helper message based on status
      let statusAdvice = 'Water storage is within normal operating parameters.';
      if (statusText === 'CRITICAL LOW') statusAdvice = 'CRITICAL: Water level is below 10%. Turn off output pumps immediately to prevent motor burnout.';
      else if (statusText === 'LOW') statusAdvice = 'LOW LEVEL: Tank is under 25% capacity. Water inflow required.';
      else if (statusText === 'HIGH') statusAdvice = 'HIGH LEVEL: Tank capacity is over 85%. Approaching full capacity.';
      else if (statusText === 'OVERLOADED') statusAdvice = 'OVERFLOW RISK: Liquid level has exceeded the sensor threshold! Shut off water supply.';

      return (
        <div className="flex-1 flex flex-col bg-slate-50 text-slate-800">
          
          {/* ================================================================= */}
          {/* Responsive Header Bar - Clean White & Light Theme */}
          {/* ================================================================= */}
          <header className="bg-white border-b border-slate-200/90 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
              
              {/* Clean Title & Tank Name - Logo Removed from Header per Request */}
              <div className="flex items-center gap-2.5 sm:gap-3">
                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-cyan-50 border border-cyan-200 flex items-center justify-center text-cyan-600 font-extrabold text-lg shadow-sm shrink-0">
                  💧
                </div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base tracking-tight text-slate-900 flex items-center gap-1.5 sm:gap-2">
                    HydroSense <span className="hidden sm:inline text-xs font-mono px-1.5 py-0.5 rounded bg-cyan-50 text-cyan-700 border border-cyan-200">Live</span>
                  </h1>
                  <p className="text-[11px] sm:text-xs text-slate-500 font-medium truncate max-w-[140px] xs:max-w-[220px] sm:max-w-none">
                    {tank.tank_name || 'SV Block Overhead Tank'}
                  </p>
                </div>
              </div>

              {/* Status & Control Actions */}
              <div className="flex items-center gap-2 sm:gap-3">
                {/* Connection Status Pill */}
                <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-mono font-medium bg-slate-100 text-slate-700 border border-slate-200">
                  <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></span>
                  <span className="hidden xs:inline">{isOnline ? 'Online' : 'Offline'}</span>
                </div>

                {/* Auto Refresh Toggle */}
                <button
                  onClick={() => setAutoRefresh(!autoRefresh)}
                  className={`p-1.5 sm:px-3 sm:py-1 rounded-lg text-xs font-semibold border transition-all flex items-center gap-1.5 ${
                    autoRefresh
                      ? 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100'
                      : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'
                  }`}
                  title={autoRefresh ? 'Live Polling Active (5s)' : 'Polling Paused'}
                >
                  <svg className={`w-4 h-4 ${autoRefresh ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  <span className="hidden md:inline">{autoRefresh ? 'Live 5s' : 'Paused'}</span>
                </button>

                {/* Tank Calibration & Settings Button */}
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 hover:text-slate-900 border border-slate-200 transition-all flex items-center gap-1.5 shadow-sm"
                  title="Calibrate Tank Settings"
                >
                  <svg className="w-4 h-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  <span className="hidden sm:inline font-medium">Settings</span>
                </button>
              </div>

            </div>
          </header>

          {/* ================================================================= */}
          {/* Main Dashboard Responsive Content (Full Light SCADA Theme) */}
          {/* ================================================================= */}
          <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6 flex-1">
            
            {/* High-Visibility Emergency Overfill / Over-Volume Alert Banner */}
            {(isOverloaded || pct >= (tank.safe_max_percent || 95)) && (

                        emailTestResult.type === 'success'
                          ? 'bg-emerald-50 border-emerald-300 text-emerald-800'
                          : 'bg-rose-50 border-rose-300 text-rose-800'
                      }`}>
                        {emailTestResult.text}
                      </div>
                    )}
                  </div>

                  <div className="pt-3 flex justify-end gap-2 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsSettingsOpen(false)}
                      className="px-3 py-1.5 text-xs text-slate-600 hover:text-slate-900 font-medium"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-xs font-bold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white shadow-md shadow-cyan-600/20 transition-all"
                    >
                      Save Settings
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React App into the DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
