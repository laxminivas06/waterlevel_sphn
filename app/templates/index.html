<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroSense IoT - Smart Water Tank Monitor</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Chart.js for Historical Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- React 18 & Babel for Zero-Build Standalone Deployment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            scada: {
              900: '#070d19',
              850: '#0b1326',
              800: '#0f172a',
              750: '#15203b',
              700: '#1e293b',
              600: '#334155',
              500: '#475569',
              accent: '#06b6d4',
              accentHover: '#0891b2',
              normal: '#10b981',
              warning: '#f59e0b',
              critical: '#ef4444',
              overload: '#dc2626',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* SCADA Wave & Pulse Animations */
    @keyframes waveMotionFront {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(-50%); }
    }
    @keyframes waveMotionBack {
      0% { transform: translateX(-50%); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(0); }
    }
    @keyframes sonarWave {
      0% { opacity: 0.9; stroke-dashoffset: 0; }
      100% { opacity: 0.1; stroke-dashoffset: 40; }
    }
    .wave-front {
      animation: waveMotionFront 6s linear infinite;
    }
    .wave-back {
      animation: waveMotionBack 8s linear infinite;
    }
    .sonar-beam {
      animation: sonarWave 1.8s linear infinite;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-scada-900 text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white flex flex-col">

  <!-- Root React Mount Container -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React 18 Application Script -->
  {% raw %}
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // API Client Helper
    // =========================================================================
    const API = {
      async getCurrent() {
        const res = await fetch('/api/water-level/current');
        return res.json();
      },
      async getTankHistory(tankId, range = '24h') {
        const res = await fetch(`/api/v1/tanks/${tankId}/history?range=${range}`);
        return res.json();
      },
      async saveTank(data) {
        const res = await fetch('/api/v1/tanks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      },
      async simulate(data) {
        const res = await fetch('/api/v1/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      }
    };

    // =========================================================================
    // Responsive SVG Fluid Tank Component
    // =========================================================================
    function FluidTankVisualizer({ percentage = 0, status = 'NORMAL', airGapCm = 0, isOverloaded = false }) {
      const clampedPct = Math.min(105, Math.max(0, percentage));
      
      // ViewBox: 240 width, 320 height. Tank liquid range: y=40 (100%) to y=280 (0%)
      const tankTopY = 40;
      const tankBottomY = 280;
      const usableHeight = tankBottomY - tankTopY; // 240px
      const liquidH = (clampedPct / 100) * usableHeight;
      const liquidY = tankBottomY - liquidH;

      // Dynamic Colors based on status
      let gradStart = '#06b6d4';
      let gradEnd = '#0284c7';
      let statusBadge = 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40';

      if (isOverloaded || status === 'OVERLOADED') {
        gradStart = '#ef4444';
        gradEnd = '#b91c1c';
        statusBadge = 'bg-red-500/30 text-red-300 border-red-500 animate-pulse';
      } else if (status === 'CRITICAL LOW') {
        gradStart = '#f87171';
        gradEnd = '#dc2626';
        statusBadge = 'bg-rose-500/20 text-rose-300 border-rose-500/40 animate-pulse';
      } else if (status === 'LOW') {
        gradStart = '#fbbf24';
        gradEnd = '#d97706';
        statusBadge = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
      } else if (status === 'HIGH') {
        gradStart = '#38bdf8';
        gradEnd = '#0284c7';
        statusBadge = 'bg-blue-500/20 text-blue-300 border-blue-500/40';
      } else {
        gradStart = '#10b981';
        gradEnd = '#059669';
        statusBadge = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
      }

      return (
        <div className="flex flex-col items-center w-full">
          <div className="w-full max-w-[240px] sm:max-w-[270px] aspect-[3/4]">
            <svg viewBox="0 0 240 320" className="w-full h-full drop-shadow-2xl">
              <defs>
                <linearGradient id={`tankLiquidGrad-${Math.round(clampedPct)}`} x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor={gradStart} />
                  <stop offset="100%" stopColor={gradEnd} />
                </linearGradient>

                <linearGradient id="tankGlassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#ffffff" stopOpacity="0.08" />
                  <stop offset="35%" stopColor="#ffffff" stopOpacity="0.02" />
                  <stop offset="70%" stopColor="#000000" stopOpacity="0.25" />
                  <stop offset="100%" stopColor="#ffffff" stopOpacity="0.1" />
                </linearGradient>

                <clipPath id="tankInnerClip">
                  <rect x="35" y="40" width="170" height="240" rx="18" ry="18" />
                </clipPath>
              </defs>

              {/* Sensor Housing at Tank Top */}
              <rect x="85" y="16" width="70" height="18" rx="5" fill="#1e293b" stroke="#475569" strokeWidth="2" />
              <circle cx="102" cy="25" r="4.5" fill="#334155" stroke="#64748b" strokeWidth="1.5" />
              <circle cx="138" cy="25" r="4.5" fill="#334155" stroke="#64748b" strokeWidth="1.5" />
              
              {/* Sonic Pulse Ray Beam down to water level */}
              <line x1="120" y1="34" x2="120" y2={liquidY} stroke="#06b6d4" strokeWidth="2.5" strokeDasharray="6 4" className="sonar-beam" />
              
              {/* Outer Tank Glass Vessel */}
              <rect x="35" y="40" width="170" height="240" rx="18" fill="#0f172a" stroke="#475569" strokeWidth="3" />

              {/* Clipped Liquid Interior */}
              <g clipPath="url(#tankInnerClip)">
                <rect x="35" y={liquidY} width="170" height={liquidH + 10} fill={`url(#tankLiquidGrad-${Math.round(clampedPct)})`} />
                
                {/* Back Wave */}
                <g transform={`translate(0, ${liquidY})`}>
                  <path className="wave-back opacity-50" fill={gradEnd}
                    d="M-200,0 C-150,-10 -100,10 -50,0 C0,-10 50,10 100,0 C150,-10 200,10 250,0 C300,-10 350,10 400,0 L400,60 L-200,60 Z" />
                </g>

                {/* Front Wave */}
                <g transform={`translate(0, ${liquidY})`}>
                  <path className="wave-front opacity-80" fill={`url(#tankLiquidGrad-${Math.round(clampedPct)})`}
                    d="M-200,0 C-140,8 -80,-8 -20,0 C40,8 100,-8 160,0 C220,8 280,-8 340,0 C400,8 460,-8 520,0 L520,60 L-200,60 Z" />
                </g>

                {/* Glass Reflection Highlight */}
                <rect x="35" y="40" width="170" height="240" fill="url(#tankGlassSheen)" pointerEvents="none" />
              </g>

              {/* Measurement Scale Marks */}
              <g stroke="#64748b" strokeWidth="1.5">
                <line x1="26" y1="40" x2="35" y2="40" />
                <text x="22" y="43" fontSize="9" fill="#94a3b8" textAnchor="end" className="font-mono">100%</text>

                <line x1="28" y1="100" x2="35" y2="100" />
                <text x="22" y="103" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">75%</text>

                <line x1="26" y1="160" x2="35" y2="160" />
                <text x="22" y="163" fontSize="9" fill="#94a3b8" textAnchor="end" className="font-mono">50%</text>

                <line x1="28" y1="220" x2="35" y2="220" />
                <text x="22" y="223" fontSize="8" fill="#64748b" textAnchor="end" className="font-mono">25%</text>

                <line x1="26" y1="280" x2="35" y2="280" />
                <text x="22" y="283" fontSize="9" fill="#94a3b8" textAnchor="end" className="font-mono">0%</text>
              </g>

              {/* Tank Feet */}
              <rect x="65" y="284" width="110" height="10" rx="3" fill="#334155" stroke="#475569" strokeWidth="1.5" />
              <rect x="50" y="294" width="140" height="5" rx="2" fill="#1e293b" />

              {/* Central Digital Readout */}
              <g textAnchor="middle">
                <text x="120" y="150" className="font-mono font-extrabold text-3xl sm:text-4xl" fill="#ffffff" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.9))">
                  {clampedPct.toFixed(1)}%
                </text>
                <text x="120" y="174" className="font-mono text-xs" fill="#e2e8f0" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.9))">
                  Air Gap: {airGapCm.toFixed(1)} cm
                </text>
              </g>

              {/* Overload Alert Tag */}
              {isOverloaded && (
                <g transform="translate(45, 105)">
                  <rect width="150" height="30" rx="6" fill="#dc2626" opacity="0.95" stroke="#ffffff" strokeWidth="1.5" className="animate-pulse" />
                  <text x="75" y="20" fill="#ffffff" fontSize="12" fontWeight="bold" textAnchor="middle" className="font-mono">
                    ⚠️ OVERFLOW RISK
                  </text>
                </g>
              )}
            </svg>
          </div>

          {/* Status Pill Badge */}
          <div className={`mt-3 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase border shadow-md ${statusBadge}`}>
            {status}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Main Single-Tank Responsive Dashboard Application
    // =========================================================================
    function App() {
      const [data, setData] = useState(null);
      const [history, setHistory] = useState([]);
      const [historyRange, setHistoryRange] = useState('24h');
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [loading, setLoading] = useState(true);
      const [isSimulateOpen, setIsSimulateOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [simDistance, setSimDistance] = useState(60);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Load live telemetry data
      const fetchLiveData = async () => {
        try {
          const res = await API.getCurrent();
          setData(res);
          setLoading(false);
        } catch (err) {
          console.error('Failed to fetch live water level data:', err);
        }
      };

      // Load historical data for chart
      const fetchHistory = async () => {
        if (!data || !data.tank) return;
        try {
          const res = await API.getTankHistory(data.tank.tank_id, historyRange);
          setHistory(res.data || []);
        } catch (err) {
          console.error('Failed to load history:', err);
        }
      };

      // Initial load and live polling timer
      useEffect(() => {
        fetchLiveData();
        const interval = setInterval(() => {
          if (autoRefresh) fetchLiveData();
        }, 5000);
        return () => clearInterval(interval);
      }, [autoRefresh]);

      useEffect(() => {
        if (data && data.tank) {
          fetchHistory();
        }
      }, [data?.tank?.tank_id, historyRange]);

      // Render & update Chart.js
      useEffect(() => {
        if (!chartRef.current || !history.length) return;

        const ctx = chartRef.current.getContext('2d');
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = history.map(h => (h.timestamp || '').slice(11, 16) || h.date);
        const percentages = history.map(h => h.water_percentage);

        // Chart gradient fill
        const gradient = ctx.createLinearGradient(0, 0, 0, 260);
        gradient.addColorStop(0, 'rgba(6, 182, 212, 0.4)');
        gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Water Level (%)',
              data: percentages,
              borderColor: '#06b6d4',
              backgroundColor: gradient,
              borderWidth: 2.5,
              tension: 0.35,
              fill: true,
              pointRadius: labels.length > 30 ? 0 : 3,
              pointHoverRadius: 6,
              pointBackgroundColor: '#06b6d4',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#0f172a',
                titleColor: '#94a3b8',
                bodyColor: '#38bdf8',
                borderColor: '#334155',
                borderWidth: 1,
                callbacks: {
                  label: (item) => `Level: ${item.raw.toFixed(1)}%`
                }
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(51, 65, 85, 0.2)' },
                ticks: { color: '#64748b', maxTicksLimit: 8, font: { size: 10 } }
              },
              y: {
                min: 0,
                max: 100,
                grid: { color: 'rgba(51, 65, 85, 0.25)' },
                ticks: {
                  color: '#64748b',
                  stepSize: 25,
                  callback: (val) => `${val}%`,
                  font: { size: 10 }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [history]);

      // Calculate state helpers
      const tank = data?.tank || {};
      const reading = data?.reading || {};
      const device = data?.device || {};
      const todaySummary = data?.today_summary || {};

      const pct = data?.water_percentage || 0;
      const vol = data?.water_volume_litres || 0;
      const depth = data?.water_level || reading?.water_height || 0;
      const distance = reading?.distance_cm || 0;
      const capacity = tank?.total_capacity_litres || 1000;
      const remainingL = Math.max(0, capacity - vol);
      const isOnline = data?.is_online || (device?.status === 'online');
      const statusText = reading?.status || tank?.level_state?.toUpperCase() || 'NORMAL';
      const isOverloaded = (statusText === 'OVERLOADED');

      // Helper message based on status
      let statusAdvice = 'Water storage is within normal operating parameters.';
      if (statusText === 'CRITICAL LOW') statusAdvice = 'CRITICAL: Water level is below 10%. Turn off output pumps immediately to prevent motor burnout.';
      else if (statusText === 'LOW') statusAdvice = 'LOW LEVEL: Tank is under 25% capacity. Water inflow required.';
      else if (statusText === 'HIGH') statusAdvice = 'HIGH LEVEL: Tank capacity is over 85%. Approaching full capacity.';
      else if (statusText === 'OVERLOADED') statusAdvice = 'OVERFLOW RISK: Liquid level has exceeded the sensor threshold! Shut off water supply.';

      return (
        <div className="flex-1 flex flex-col bg-scada-900 text-slate-100">
          
          {/* ================================================================= */}
          {/* Responsive Header Bar */}
          {/* ================================================================= */}
          <header className="bg-scada-850 border-b border-scada-700/80 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
              
              {/* Brand Logo & Title */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 shrink-0">
                  <svg className="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                  </svg>
                </div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base tracking-tight text-white flex items-center gap-2">
                    HydroSense <span className="hidden sm:inline text-xs font-mono px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Live</span>
                  </h1>
                  <p className="text-[11px] sm:text-xs text-slate-400 truncate">{tank.tank_name || 'SV Block Overhead Tank'}</p>
                </div>
              </div>

              {/* Status & Control Actions */}
              <div className="flex items-center gap-2 sm:gap-3">
                {/* Connection Status Pill */}
                <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-mono font-medium bg-scada-800 border border-scada-700">
                  <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`}></span>
                  <span className="hidden xs:inline">{isOnline ? 'Online' : 'Offline'}</span>
                </div>

                {/* Auto Refresh Toggle */}
                <button
                  onClick={() => setAutoRefresh(!autoRefresh)}
                  className={`p-1.5 sm:px-3 sm:py-1 rounded-lg text-xs font-semibold border transition-all flex items-center gap-1.5 ${
                    autoRefresh
                      ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
                      : 'bg-scada-800 text-slate-400 border-scada-700'
                  }`}
                  title={autoRefresh ? 'Live Polling Active (5s)' : 'Polling Paused'}
                >
                  <svg className={`w-4 h-4 ${autoRefresh ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  <span className="hidden md:inline">{autoRefresh ? 'Live 5s' : 'Paused'}</span>
                </button>

                {/* Test Simulator Button */}
                <button
                  onClick={() => setIsSimulateOpen(true)}
                  className="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600/20 text-cyan-300 border border-cyan-500/30 hover:bg-cyan-600/30 transition-colors flex items-center gap-1"
                >
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                  <span className="hidden sm:inline">Simulator</span>
                </button>

                {/* Tank Settings Button */}
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-semibold bg-scada-800 text-slate-300 border border-scada-700 hover:text-white hover:border-slate-500 transition-colors flex items-center gap-1"
                  title="Calibrate Tank Settings"
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  <span className="hidden sm:inline">Calibrate</span>
                </button>
              </div>

            </div>
          </header>

          {/* ================================================================= */}
          {/* Main Dashboard Responsive Content */}
          {/* ================================================================= */}
          <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6 flex-1">
            
            {/* Top Hero Section: Split Fluid Visualizer + Real-time Telemetry */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
              
              {/* Left Column: Visual Animated Fluid Tank (lg: 5 cols) */}
              <div className="lg:col-span-5 bg-scada-800/70 border border-scada-700/80 rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col items-center justify-between">
                <div className="w-full flex items-center justify-between border-b border-scada-700 pb-3 mb-3">
                  <div>
                    <h2 className="text-base sm:text-lg font-bold text-white tracking-tight">{tank.tank_name || 'SV Block Overhead Tank'}</h2>
                    <span className="text-xs font-mono text-cyan-400 capitalize">{tank.shape || 'Cylindrical'} • {capacity} L</span>
                  </div>
                  <span className="text-xs font-mono px-2 py-0.5 rounded bg-scada-900 border border-scada-700 text-slate-400">
                    ID: {tank.tank_id || 'SV_BLOCK_OVER_TANK'}
                  </span>
                </div>

                {/* SVG Visualizer */}
                <FluidTankVisualizer
                  percentage={pct}
                  status={statusText}
                  airGapCm={distance}
                  isOverloaded={isOverloaded}
                />

                <div className="w-full text-center text-xs text-slate-400 mt-3 pt-3 border-t border-scada-700/60 flex items-center justify-between">
                  <span>Last Transmission:</span>
                  <span className="font-mono text-cyan-400">{reading?.timestamp || 'Waiting for sensor...'}</span>
                </div>
              </div>

              {/* Right Column: Live Telemetry Cards & Advice Banner (lg: 7 cols) */}
              <div className="lg:col-span-7 flex flex-col justify-between space-y-4">
                
                {/* Status Advice Alert Banner */}
                <div className={`p-4 rounded-2xl border flex items-start gap-3 shadow-md ${
                  isOverloaded
                    ? 'bg-red-500/20 border-red-500/50 text-red-200 animate-pulse'
                    : statusText === 'CRITICAL LOW'
                    ? 'bg-rose-500/20 border-rose-500/50 text-rose-200'
                    : statusText === 'LOW'
                    ? 'bg-amber-500/20 border-amber-500/50 text-amber-200'
                    : statusText === 'HIGH'
                    ? 'bg-blue-500/20 border-blue-500/50 text-blue-200'
                    : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200'
                }`}>
                  <div className="text-xl sm:text-2xl mt-0.5">
                    {isOverloaded || statusText === 'CRITICAL LOW' ? '🚨' : statusText === 'LOW' ? '⚠️' : '💧'}
                  </div>
                  <div className="flex-1">
                    <h3 className="font-bold text-sm sm:text-base tracking-tight capitalize">{statusText} Condition</h3>
                    <p className="text-xs sm:text-sm mt-0.5 opacity-90 leading-relaxed">{statusAdvice}</p>
                  </div>
                </div>

                {/* 4 Primary Metric Cards (2x2 Grid) */}
                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                  {/* Card 1: Water Percentage */}
                  <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span className="text-xs font-mono uppercase text-slate-400">Fill Level</span>
                    <span className="text-2xl sm:text-3xl font-extrabold text-cyan-400 font-mono mt-2">
                      {pct.toFixed(1)}<span className="text-sm font-normal">%</span>
                    </span>
                    <div className="w-full bg-scada-700 rounded-full h-1.5 mt-2 overflow-hidden">
                      <div className="bg-cyan-500 h-1.5 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, pct)}%` }}></div>
                    </div>
                  </div>

                  {/* Card 2: Water Volume */}
                  <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span className="text-xs font-mono uppercase text-slate-400">Water Volume</span>
                    <span className="text-2xl sm:text-3xl font-extrabold text-emerald-400 font-mono mt-2">
                      {Math.round(vol).toLocaleString()}
                      <span className="text-xs sm:text-sm font-normal text-slate-400 ml-1">L</span>
                    </span>
                    <span className="text-[11px] text-slate-500 mt-1">of {capacity} L rated</span>
                  </div>

                  {/* Card 3: Water Depth */}
                  <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span className="text-xs font-mono uppercase text-slate-400">Water Depth</span>
                    <span className="text-2xl sm:text-3xl font-extrabold text-white font-mono mt-2">
                      {depth.toFixed(1)}
                      <span className="text-xs sm:text-sm font-normal text-slate-400 ml-1">cm</span>
                    </span>
                    <span className="text-[11px] text-slate-500 mt-1">Height: {tank.tank_height_cm || 200} cm</span>
                  </div>

                  {/* Card 4: Sensor Air Gap */}
                  <div className="bg-scada-800/80 border border-scada-700 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span className="text-xs font-mono uppercase text-slate-400">Air Gap</span>
                    <span className="text-2xl sm:text-3xl font-extrabold text-amber-300 font-mono mt-2">
                      {distance.toFixed(1)}
                      <span className="text-xs sm:text-sm font-normal text-slate-400 ml-1">cm</span>
                    </span>
                    <span className="text-[11px] text-slate-500 mt-1">Offset: {tank.sensor_offset_cm || 15} cm</span>
                  </div>
                </div>

                {/* Secondary Tank Details Card */}
                <div className="bg-scada-800/70 border border-scada-700/80 rounded-2xl p-4 sm:p-5 shadow-lg space-y-3">
                  <h4 className="text-xs font-mono uppercase tracking-wider text-slate-400 flex items-center justify-between">
                    <span>Operational Calibration Details</span>
                    <span className="text-cyan-400 font-mono">1 Tank Monitored</span>
                  </h4>
                  
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                    <div className="bg-scada-900/60 p-2.5 rounded-lg border border-scada-750">
                      <span className="text-slate-400 block">Remaining Volume:</span>
                      <span className="font-mono text-white text-sm font-bold">{Math.round(remainingL).toLocaleString()} L</span>
                    </div>
                    <div className="bg-scada-900/60 p-2.5 rounded-lg border border-scada-750">
                      <span className="text-slate-400 block">Low Alert Trigger:</span>
                      <span className="font-mono text-amber-400 text-sm font-bold">&le; {tank.low_percent || 25}%</span>
                    </div>
                    <div className="bg-scada-900/60 p-2.5 rounded-lg border border-scada-750">
                      <span className="text-slate-400 block">Critical Low:</span>
                      <span className="font-mono text-rose-400 text-sm font-bold">&le; {tank.critical_low_percent || 10}%</span>
                    </div>
                    <div className="bg-scada-900/60 p-2.5 rounded-lg border border-scada-750">
                      <span className="text-slate-400 block">High Fill Level:</span>
                      <span className="font-mono text-blue-400 text-sm font-bold">&ge; {tank.high_percent || 85}%</span>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            {/* =============================================================== */}
            {/* Historical Analytics & Trends Chart */}
            {/* =============================================================== */}
            <div className="bg-scada-800/70 border border-scada-700/80 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-scada-700 pb-3">
                <div>
                  <h3 className="text-base sm:text-lg font-bold text-white tracking-tight flex items-center gap-2">
                    <span>Water Level Trends</span>
                    <span className="text-xs font-mono px-2 py-0.5 rounded bg-scada-900 text-cyan-400 border border-scada-700">
                      {historyRange} Range
                    </span>
                  </h3>
                  <p className="text-xs text-slate-400">Time-series ultrasonic telemetry</p>
                </div>

                {/* Range Selectors */}
                <div className="flex items-center gap-1 bg-scada-900 p-1 rounded-xl border border-scada-700 self-stretch sm:self-auto justify-center">
                  {['24h', '7d', '15d'].map((r) => (
                    <button
                      key={r}
                      onClick={() => setHistoryRange(r)}
                      className={`px-3 py-1 text-xs font-bold font-mono rounded-lg transition-all ${
                        historyRange === r
                          ? 'bg-cyan-500 text-white shadow-sm'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {r.toUpperCase()}
                    </button>
                  ))}
                </div>
              </div>

              {/* Chart Canvas */}
              <div className="h-64 sm:h-72 md:h-80 w-full relative">
                {history.length === 0 ? (
                  <div className="h-full flex items-center justify-center text-xs text-slate-500 font-mono">
                    No historical readings recorded yet for this time window.
                  </div>
                ) : (
                  <canvas ref={chartRef}></canvas>
                )}
              </div>
            </div>

          </main>

          {/* ================================================================= */}
          {/* Footer */}
          {/* ================================================================= */}
          <footer className="bg-scada-850 border-t border-scada-700/80 py-4 px-6 text-center text-xs text-slate-500">
            <p>HydroSense IoT Smart Water Tank Monitor • Pure JSON Database Edition • Running on PythonAnywhere</p>
          </footer>

          {/* ================================================================= */}
          {/* Interactive Testing Simulator Modal */}
          {/* ================================================================= */}
          {isSimulateOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-scada-800 border border-scada-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-scada-700 pb-3">
                  <h3 className="font-bold text-white text-base flex items-center gap-2">
                    <span>🧪 Sensor Test Simulator</span>
                  </h3>
                  <button onClick={() => setIsSimulateOpen(false)} className="text-slate-400 hover:text-white text-lg">&times;</button>
                </div>

                <p className="text-xs text-slate-300">
                  Simulate ultrasonic sensor pulses to test the water animation, volumetric formulas, and thresholds live.
                </p>

                <div className="space-y-2">
                  <div className="flex justify-between text-xs font-mono">
                    <span className="text-slate-400">Target Air Gap Distance:</span>
                    <span className="text-cyan-400 font-bold">{simDistance} cm</span>
                  </div>
                  <input
                    type="range"
                    min="5"
                    max="220"
                    step="1"
                    value={simDistance}
                    onChange={(e) => setSimDistance(Number(e.target.value))}
                    className="w-full accent-cyan-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                    <span>5 cm (Overloaded)</span>
                    <span>115 cm (50%)</span>
                    <span>215 cm (Empty)</span>
                  </div>
                </div>

                <div className="flex gap-2">
                  {[
                    { label: 'Full (15cm)', dist: 15 },
                    { label: 'Half (115cm)', dist: 115 },
                    { label: 'Low (180cm)', dist: 180 },
                    { label: 'Crit (205cm)', dist: 205 },
                  ].map(p => (
                    <button
                      key={p.label}
                      onClick={() => setSimDistance(p.dist)}
                      className="flex-1 py-1 px-1.5 text-[11px] font-mono rounded bg-scada-900 border border-scada-700 text-slate-300 hover:text-white"
                    >
                      {p.label}
                    </button>
                  ))}
                </div>

                <div className="pt-2 flex justify-end gap-2 border-t border-scada-700">
                  <button
                    onClick={() => setIsSimulateOpen(false)}
                    className="px-3 py-1.5 text-xs text-slate-400 hover:text-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={async () => {
                      await API.simulate({
                        device_id: tank.tank_id || 'SV_BLOCK_OVER_TANK',
                        tank_id: tank.tank_id || 'SV_BLOCK_OVER_TANK',
                        distance_cm: simDistance,
                      });
                      await fetchLiveData();
                      setIsSimulateOpen(false);
                    }}
                    className="px-4 py-1.5 text-xs font-bold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white"
                  >
                    Send Telemetry
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* Tank Calibration & Settings Modal */}
          {/* ================================================================= */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-scada-800 border border-scada-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-scada-700 pb-3">
                  <h3 className="font-bold text-white text-base flex items-center gap-2">
                    <span>⚙️ Tank Calibration & Geometry</span>
                  </h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white text-lg">&times;</button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    const payload = {
                      tank_id: tank.tank_id || 'SV_BLOCK_OVER_TANK',
                      tank_name: form.tank_name.value,
                      shape: form.shape.value,
                      tank_height_cm: parseFloat(form.tank_height_cm.value),
                      sensor_offset_cm: parseFloat(form.sensor_offset_cm.value),
                      total_capacity_litres: parseFloat(form.total_capacity_litres.value),
                      low_percent: parseFloat(form.low_percent.value),
                      critical_low_percent: parseFloat(form.critical_low_percent.value),
                      high_percent: parseFloat(form.high_percent.value),
                    };
                    await API.saveTank(payload);
                    await fetchLiveData();
                    setIsSettingsOpen(false);
                  }}
                  className="space-y-3 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1">Tank Name</label>
                    <input
                      name="tank_name"
                      defaultValue={tank.tank_name || 'SV Block Overhead Tank'}
                      className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-white font-medium"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Shape</label>
                      <select
                        name="shape"
                        defaultValue={tank.shape || 'cylinder'}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-white font-medium"
                      >
                        <option value="cylinder">Cylindrical (Sintex / Overhead)</option>
                        <option value="rectangle">Rectangular (Sump / Underground)</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Total Capacity (Litres)</label>
                      <input
                        type="number"
                        step="10"
                        name="total_capacity_litres"
                        defaultValue={tank.total_capacity_litres || 1000}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-white font-mono"
                        required
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Tank Internal Height (cm)</label>
                      <input
                        type="number"
                        step="0.1"
                        name="tank_height_cm"
                        defaultValue={tank.tank_height_cm || 200}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-white font-mono"
                        required
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Sensor Offset (cm)</label>
                      <input
                        type="number"
                        step="0.1"
                        name="sensor_offset_cm"
                        defaultValue={tank.sensor_offset_cm || 15}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-white font-mono"
                        required
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Low Warning (%)</label>
                      <input
                        type="number"
                        step="1"
                        name="low_percent"
                        defaultValue={tank.low_percent || 25}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-amber-300 font-mono"
                        required
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Critical Low (%)</label>
                      <input
                        type="number"
                        step="1"
                        name="critical_low_percent"
                        defaultValue={tank.critical_low_percent || 10}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-rose-300 font-mono"
                        required
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">High Full (%)</label>
                      <input
                        type="number"
                        step="1"
                        name="high_percent"
                        defaultValue={tank.high_percent || 85}
                        className="w-full bg-scada-900 border border-scada-700 rounded-lg p-2 text-blue-300 font-mono"
                        required
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex justify-end gap-2 border-t border-scada-700">
                    <button
                      type="button"
                      onClick={() => setIsSettingsOpen(false)}
                      className="px-3 py-1.5 text-xs text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-xs font-bold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white"
                    >
                      Save Calibration
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React App into the DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
